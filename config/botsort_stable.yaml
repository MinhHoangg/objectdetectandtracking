# BoT-SORT with appearance-based ReID for the most ID-stable tracking.
# Slower than ByteTrack but recovers IDs after long occlusions.
# Use with: --tracker-config config/botsort_stable.yaml
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.30
track_buffer: 90
match_thresh: 0.85
fuse_score: True

# BoT-SORT-specific
gmc_method: sparseOptFlow    # global motion compensation
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: True
model: auto                  # ReID backbone; 'auto' lets ultralytics pick
